name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bridge dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check browser application syntax and privacy boundary
        run: node tests/check_app.mjs
      - name: Check web-first README entry
        run: node tests/check_entry.mjs
      - name: Check SVG and native curve parity
        run: node tests/check_curves.mjs
      - name: Check clipboard shortcuts
        run: node tests/check_clipboard.mjs
      - name: Check connected-region filling
        run: node tests/check_regions.mjs
      - name: Check paint layers and reference tools
        run: node tests/check_paint_tools.mjs
      - name: Check selection and gesture behavior
        run: node tests/check_selection.mjs
      - name: Check layer folders and drag ordering
        run: node tests/check_layers.mjs
      - name: Check automatic tracing and junction topology
        run: node tests/check_auto_trace.mjs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
