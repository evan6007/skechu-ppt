name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bridge dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check browser application syntax and privacy boundary
        run: node tests/check_app.mjs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
