name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build portable application
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.2.0-dev' }
          $env:SKECHU_VERSION = $version
          python packaging/windows/write-version-info.py packaging/windows/generated-version-info.txt
          pyinstaller --noconfirm --clean --windowed --name Skechu-PPT `
            --version-file packaging/windows/generated-version-info.txt `
            --icon assets/brand/skechu-ppt-mark.ico `
            --add-data "app/index.html;." `
            --add-data "app/about.html;." `
            --add-data "app/mobile-controls.js;." `
            --add-data "app/mobile-controls.css;." `
            --add-data "app/automation;automation" `
            --add-data "app/starter-brain.png;." `
            --add-data "app/local-smoothing.js;." `
            --add-data "app/theme-controls.js;." `
            --add-data "app/theme-controls.css;." `
            --add-data "app/github-star.js;." `
            --add-data "app/github-star.css;." `
            --add-data "app/github-star-config.json;." `
            --add-data "app/region-fill.js;." `
            --add-data "app/trace-boundary.js;." `
            --add-data "app/path-cut.js;." `
            --add-data "app/cut-tools.js;." `
            --add-data "app/cut-tools.css;." `
            --add-data "app/gradient-fill.js;." `
            --add-data "app/gradient-fill.css;." `
            --add-data "app/paint-layers.js;." `
            --add-data "app/editor-render.js;." `
            --add-data "app/compound-fill.js;." `
            --add-data "app/paint-tools.js;." `
            --add-data "app/pan-tool.js;." `
            --add-data "app/touch-gestures.js;." `
            --add-data "app/selection-controls.js;." `
            --add-data "app/workspace-actions.js;." `
            --add-data "app/project-file-store.js;." `
            --add-data "app/project-files.js;." `
            --add-data "app/project-files.css;." `
            --add-data "app/layer-controls.js;." `
            --add-data "app/layer-controls.css;." `
            --add-data "app/panel-layout.js;." `
            --add-data "app/clipboard-controls.js;." `
            --add-data "app/clipboard-images.js;." `
            --add-data "app/portable-pptx.js;." `
            --add-data "app/portable-ppt-controls.js;." `
            --add-data "app/portable-ppt-worker.js;." `
            --add-data "app/clipboard-controls.css;." `
            --add-data "app/web-ppt-client.js;." `
            --add-data "app/web-ppt-helper.js;." `
            --add-data "app/web-ppt.html;." `
            --add-data "app/ppt-preparation.js;." `
            --add-data "app/paint-tools.css;." `
            --add-data "app/illustration-trace.js;." `
            --add-data "app/source-gradient.js;." `
            --add-data "app/gradient-regions.js;." `
            --add-data "app/color-field.js;." `
            --add-data "app/color-field-preview.js;." `
            --add-data "app/color-field-worker.js;." `
            --add-data "app/image-upscale-core.js;." `
            --add-data "app/image-upscale-worker.js;." `
            --add-data "app/image-upscale-ui.js;." `
            --add-data "app/image-upscale.css;." `
            --add-data "app/vendor;vendor" `
            --add-data "app/auto-trace.js;." `
            --add-data "app/auto-trace-ui.js;." `
            --add-data "app/auto-trace-worker.js;." `
            --add-data "app/auto-trace.css;." `
            --add-data "app/manifest.webmanifest;." `
            --add-data "app/service-worker.js;." `
            --add-data "app/skechu-mark.svg;." `
            --add-data "app/skechu-icon.png;." `
            app/bridge.py
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Skechu-PPT/Skechu-PPT.exe -ArgumentList '--no-open-browser','--port','8877' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..40) {
              Start-Sleep -Milliseconds 250
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8877/ -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'Skechu-PPT') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Packaged Skechu-PPT did not start.' }
            $bridgeStatus = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8877/web-ppt/status -Headers @{Origin='https://evan6007.github.io'} -TimeoutSec 2
            $capabilities = $bridgeStatus.Content | ConvertFrom-Json
            if ($capabilities.protocol -ne 1 -or 'inline-copy' -notin $capabilities.capabilities -or 'gradient-fill-v1' -notin $capabilities.capabilities -or 'inline-image-v1' -notin $capabilities.capabilities) { throw 'Packaged inline PPT connection unavailable.' }
            if ($bridgeStatus.Headers['Access-Control-Allow-Origin'] -ne 'https://evan6007.github.io') { throw 'Packaged web origin mismatch.' }
            if ($response.Content -notmatch 'id="clipboard-install"') { throw 'Packaged editor is missing the direct installer guide.' }
            foreach ($asset in @('web-ppt.html','web-ppt-helper.js','web-ppt-client.js','clipboard-controls.js','clipboard-controls.css','ppt-preparation.js','gradient-fill.js','gradient-fill.css','layer-controls.js','layer-controls.css','panel-layout.js','theme-controls.js','theme-controls.css','project-file-store.js','project-files.js','image-upscale-ui.js','image-upscale-worker.js','source-gradient.js','gradient-regions.js','vendor/super-resolution/anime-v3.json','vendor/super-resolution/anime-v3-f32.bin','vendor/super-resolution/tf-4.22.0.min.js')) {
              $assetResponse = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8877/$asset" -TimeoutSec 2
              if ($assetResponse.StatusCode -ne 200) { throw "Missing packaged asset: $asset" }
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.2.0-dev' }
          $env:SKECHU_VERSION = $version
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging/windows/skechu.iss
      - name: Record installer signature and checksum
        shell: pwsh
        run: ./packaging/windows/write-release-info.ps1
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skechu-PPT-Windows-Setup
          path: dist-installer/*
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist-installer/Skechu-PPT-Windows-Setup.exe dist-installer/SHA256SUMS.txt dist-installer/signature-status.json `
            --repo '${{ github.repository }}' `
            --title "Skechu-PPT ${{ github.ref_name }}" `
            --notes-file dist-installer/release-notes.md --generate-notes
